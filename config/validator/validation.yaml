App\Entity\Location:
    properties:
        city:
            - NotBlank:
                  message: 'Miasto nie może być puste.'
                  groups: [new, edit]
            - Length:
                  max: 255
                  groups: [new, edit]

        country:
            - NotBlank:
                  message: 'Wybierz państwo.'
                  groups: [new, edit]
            - Country:
                  message: 'Wybierz prawidłowy kod państwa.'
                  groups: [new, edit]

        latitude:
            - NotBlank:
                  message: 'Szerokość geograficzna nie może być pusta.'
                  groups: [new, edit]
            - Range:
                  min: -90
                  max: 90
                  notInRangeMessage: 'Szerokość musi być w zakresie od -90 do 90.'
                  groups: [new, edit]

        longitude:
            - NotBlank:
                  message: 'Długość geograficzna nie może być pusta.'
                  groups: [new, edit]
            - Range:
                  min: -180
                  max: 180
                  notInRangeMessage: 'Długość musi być w zakresie od -180 do 180.'
                  groups: [new, edit]

        province:
            - NotBlank:
                  message: 'Województwo nie może być puste.'
                  groups: [new, edit]
            - Length:
                  max: 255
                  groups: [new, edit]


App\Entity\Measurement:
    properties:
        date:
            - NotNull:
                  message: 'Data pomiaru nie może być pusta.'
                  groups: [new, edit]

        celsius:
            - NotBlank:
                  message: 'Temperatura nie może być pusta.'
                  groups: [new, edit]
            - Range:
                  min: -100
                  max: 70
                  notInRangeMessage: 'Temperatura musi być w zakresie od -100 do 70°C.'
                  groups: [new, edit]

        measurementName:
            - NotBlank:
                  message: 'Nazwa pomiaru nie może być pusta.'
                  groups: [new, edit]
            - Length:
                  max: 255
                  groups: [new, edit]

        pressure:
            - NotBlank:
                  message: 'Ciśnienie nie może być puste.'
                  groups: [new, edit]
            - Range:
                  min: 0
                  max: 1200
                  notInRangeMessage: 'Ciśnienie musi być w zakresie od 0 do 1200.'
                  groups: [new, edit]

        windSpeed:
            - NotBlank:
                  message: 'Prędkość wiatru nie może być pusta.'
                  groups: [new, edit]
            - Range:
                  min: 0
                  max: 500
                  notInRangeMessage: 'Prędkość wiatru musi być w zakresie od 0 do 500.'
                  groups: [new, edit]

        cloudiness:
            - NotBlank:
                  message: 'Zachmurzenie nie może być puste.'
                  groups: [new, edit]
            - Range:
                  min: 0
                  max: 100
                  notInRangeMessage: 'Zachmurzenie musi być w zakresie od 0 do 100%.'
                  groups: [new, edit]

        humidity:
            - NotBlank:
                  message: 'Wilgotność nie może być pusta.'
                  groups: [new, edit]
            - Range:
                  min: 0
                  max: 100
                  notInRangeMessage: 'Wilgotność musi być w zakresie od 0 do 100%.'
                  groups: [new, edit]

        location:
            - NotNull:
                  message: 'Wybierz lokalizację.'
                  groups: [new, edit]
